<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Kamar Operasi · RSUP Dr M Djamil Padang</title>
<link rel="stylesheet" href="../assets/operasi/style.css">
<script src="../assets/operasi/script.js" defer></script>
</head>
<body>
<main class="board">
  <header class="top">
    <div class="brand">
      <a class="back" href="../igd/index.html" aria-label="Kembali ke dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div><h1>Laporan Kamar Operasi</h1><p>RSUP Dr. M. Djamil Padang</p></div>
    </div>
    <div class="right">
      <div class="clock"><b id="time">--:--:--</b><span><i class="live" aria-hidden="true"></i><em id="date">-</em></span></div>
      <button class="theme" id="theme" type="button" aria-label="Ganti tema terang atau gelap">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="stats" aria-label="Ringkasan">
    <div class="stat"><b class="num" data-key="cap">0</b><span>Total kamar operasi</span></div>
    <div class="stat"><b class="num" data-key="occ">0</b><span>Sedang dipakai</span></div>
    <div class="stat s-green"><b class="num" data-key="free">0</b><span>Tersedia</span></div>
    <div class="stat s-amber"><b class="num" data-key="pct">0</b><span>Keterisian</span></div>
  </section>

  <section class="card list-card">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filter status operasi"></div>
    </div>
    <p class="count" id="count"></p>

    <div class="scroll"><table>
      <thead>
        <tr>
          <th rowspan="2"><button type="button" data-sort="ok">OK<i></i></button></th>
          <th colspan="3" class="grp">Pasien</th>
          <th rowspan="2"><button type="button" data-sort="end">Jam operasi<i></i></button></th>
          <th rowspan="2"><button type="button" data-sort="op">Operator<i></i></button></th>
          <th rowspan="2"><button type="button" data-sort="an">Anestesi<i></i></button></th>
          <th rowspan="2"><button type="button" data-sort="act">Tindakan<i></i></button></th>
          <th rowspan="2"><button type="button" data-sort="dest">Kamar tujuan<i></i></button></th>
        </tr>
        <tr class="sub">
          <th><button type="button" data-sort="ini">Inisial<i></i></button></th>
          <th class="c-sx"><button type="button" data-sort="sx">L/P<i></i></button></th>
          <th class="c-age"><button type="button" data-sort="age">Umur<i></i></button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table></div>

    <div class="empty" id="empty" hidden><p>Tidak ada operasi yang cocok.</p><button type="button" id="reset">Tampilkan semua</button></div>
  </section>
  <footer class="note">Data contoh. Hanya inisial pasien yang ditampilkan.</footer>
</main>
</body>
</html>
