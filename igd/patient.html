<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Pasien IGD · RSUP Dr M Djamil Padang</title>
<script src="../assets/igd/patientscript.js"></script>

<link rel="stylesheet" href="../assets/igd/patient.css">
</head>
<body>
<main class="board">
  <header class="top">
    <div class="brand">
      <a class="back" href="index.html" aria-label="Kembali ke dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div>
        <h1>Daftar Pasien IGD</h1>
        <p>RSUP Dr. M. Djamil Padang · Instalasi Gawat Darurat</p>
      </div>
    </div>
    <div class="right">
      <div class="clock">
        <b id="time">--:--:--</b>
        <span><i class="live" aria-hidden="true"></i><em id="date">-</em></span>
      </div>
      <button class="theme" id="theme" type="button" aria-label="Ganti tema terang atau gelap">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="stats" aria-label="Ringkasan">
    <button class="stat active" type="button" data-filter="all"><b class="num" data-key="all">0</b><span>Total pasien IGD</span></button>
    <button class="stat s-green" type="button" data-filter="normal"><b class="num" data-key="normal">0</b><span>Normal</span></button>
    <button class="stat s-amber" type="button" data-filter="warning"><b class="num" data-key="warning">0</b><span>Waspada &gt; 2 jam</span></button>
    <button class="stat s-red" type="button" data-filter="delayed"><b class="num" data-key="delayed">0</b><span>Respon ≥ 3 jam</span></button>
  </section>

  <section class="card table-card">
    <div class="toolbar">
      <p class="count" id="count"></p>
    </div>

    <div class="scroll">
      <table>
        <colgroup><col style="width:23%"><col style="width:20%"><col style="width:10%"><col style="width:17%"><col style="width:11%"><col style="width:9%"><col style="width:10%"></colgroup>
        <thead>
          <tr>
            <th><button type="button" data-sort="name">Pasien<i></i></button></th>
            <th><button type="button" data-sort="doctor">Dokter<i></i></button></th>
            <th><button type="button" data-sort="registered">Terdaftar<i></i></button></th>
            <th><button type="button" data-sort="response">Waktu respon<i></i></button></th>
            <th>Disposisi</th>
            <!-- <th>Ruang Rawat Inap</th> -->
            <!-- <th>Kasur Rawat Inap</th> -->
            <th>Reg. bangsal</th>
            <th class="ta-r">Keterangan</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="empty" id="empty" hidden>
      <p>Tidak ada pasien yang cocok.</p>
      <button type="button" id="reset">Tampilkan semua</button>
    </div>
  </section>

  <footer class="legend">
    <span><i style="background:var(--green)"></i><b class="g">Normal</b> &lt; 2 jam</span>
    <span><i style="background:var(--amber)"></i><b class="a">Waspada</b> 2–3 jam</span>
    <span><i style="background:var(--red)"></i><b class="r">Terlambat</b> ≥ 3 jam</span>
    <span><i style="background:var(--blue)"></i><b class="b">Diterima</b> sudah diterima rawat inap</span>
  </footer>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
